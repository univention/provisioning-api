spec:
  inputs:
    job_prefix:
      default: ""
      description: "Optional job name prefix, for example the app name. Prevents name collisions in composed pipelines."
    pipeline_stage:
      default: "build"
      description: "The name of the stage which contains the basedpyright job."
    job_rules:
      type: array
      default:
        - if: $CI_MERGE_REQUEST_ID
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_COMMIT_TAG
      description: "Rules controlling when the job runs. Override to add changes filters or different pipeline coverage."
    basedpyright_image:
      default: "gitregistry.knut.univention.de/univention/dev/tooling/ci-components/basedpyright:branch-jgietzel-typehintbasedpyright"
      description: "Container image used to execute basedpyright. Default points to the image published by build_basedpyright."
    python_version:
      default: "3.13"
      description: "Python version target for basedpyright analysis. Defaults to 3.13 to avoid Python 3.14 typeshed baseline issues."
    python_paths:
      default: "."
      description: "Space-separated list of files or directories to analyze. Defaults to the current repository root."
    baseline_file:
      default: "basedpyright-baseline.json"
      description: "Path to the basedpyright baseline file committed in the repository. Suppresses pre-existing errors so only new diagnostics fail the job. Create or refresh it with 'basedpyright --writebaseline --baselinefile basedpyright-baseline.json' in the same environment used by CI."
    dependency_install_command:
      default: ""
      description: "Optional shell command executed before basedpyright to install project dependencies, preferably into workspace-local paths such as '.venv/' (for example 'uv sync --dev' or 'python -m venv .venv && . .venv/bin/activate && pip install -r requirements.txt')."
    allow_failure:
      type: boolean
      default: true
      description: "Keep the job non-blocking by default; set to false to fail the pipeline on new basedpyright diagnostics."

---

"$[[ inputs.job_prefix ]]type_hint_basedpyright":
  stage: "$[[ inputs.pipeline_stage ]]"
  image: "$[[ inputs.basedpyright_image ]]"
  needs: []
  allow_failure: $[[ inputs.allow_failure ]]
  rules: $[[ inputs.job_rules ]]
  cache:
    key: "$CI_JOB_NAME"
    policy: pull-push
    paths:
      - .cache/pip/
      - .cache/uv/
      - .cache/xdg/
      - .venv/
  artifacts:
    when: always
    reports:
      codequality: basedpyright-code-quality.json
    paths:
      - basedpyright-code-quality.json
  script:
    - |
      set -eu
      BASELINE_FILE="$[[ inputs.baseline_file ]]"
      DEPENDENCY_INSTALL_COMMAND="$[[ inputs.dependency_install_command ]]"
      PYTHON_VERSION="$[[ inputs.python_version ]]"
      PATHS="$[[ inputs.python_paths ]]"
      CACHE_ROOT="${CI_PROJECT_DIR}/.cache"

      export PIP_CACHE_DIR="${CACHE_ROOT}/pip"
      export UV_CACHE_DIR="${CACHE_ROOT}/uv"
      export XDG_CACHE_HOME="${CACHE_ROOT}/xdg"

      mkdir -p "$PIP_CACHE_DIR" "$UV_CACHE_DIR" "$XDG_CACHE_HOME"

      if [ -z "$PATHS" ]; then
        echo "python_paths input must not be empty." >&2
        exit 1
      fi

      for path in $PATHS; do
        if [ ! -e "$path" ]; then
          echo "Configured python_paths entry not found: $path" >&2
          exit 1
        fi
      done

      if [ -n "$BASELINE_FILE" ] && [ ! -f "$BASELINE_FILE" ]; then
        echo "Configured baseline_file not found: $BASELINE_FILE" >&2
        echo "Create it locally with: basedpyright --writebaseline --baselinefile $BASELINE_FILE" >&2
        exit 1
      fi

      if [ -n "$DEPENDENCY_INSTALL_COMMAND" ]; then
        echo "Installing project dependencies using: $DEPENDENCY_INSTALL_COMMAND"
        echo "Prefer workspace-local environments such as .venv/ so runner caches can be reused across jobs."
        sh -ceu "$DEPENDENCY_INSTALL_COMMAND"
      fi

      echo "Running basedpyright with baseline: $BASELINE_FILE"
      set --
      for path in $PATHS; do
        set -- "$@" "$path"
      done
      basedpyright \
        --pythonversion "$PYTHON_VERSION" \
        --baselinefile "$BASELINE_FILE" \
        --baselinemode=lock \
        --gitlabcodequality basedpyright-code-quality.json \
        "$@"
