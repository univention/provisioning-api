spec:
  inputs:
    build_stage:
      default: "build"
      description: "The name of the stage which contains the build jobs."
    ucs_base_version:
      description: "The UCS base version the app versions are scoped for."
    scope:
      description: "The scope to import the package into."
    yaml_based_upload:
      default: true
      type: boolean
      description: "Upload packages from yaml files in doc/errata/staging/. If set to false upload from /var/univention/buildsystem2/apt/ucs_${UCS_RELEASE}-0-${SCOPE}/*/*.deb"
    additional_upload_needs:
      type: array
      default:
        - create_app_version
    git_build_rules:
      default:
        - if: $CI_MERGE_REQUEST_ID
      type: array
      description: "Rules for when to build debian packages in git"

---

deb_build_git:
  stage: $[[ inputs.build_stage ]]
  image: gitregistry.knut.univention.de/univention/dev/tooling/ci-components/deb-builder-$[[ inputs.ucs_base_version ]]:latest
  rules:
    - $[[ inputs.git_build_rules ]]
  script:
    - build_debian_packages
  artifacts:
    paths:
      - artifacts

deb_repo_import:
  stage: $[[ inputs.build_stage ]]
  variables:
    GIT_DEPTH: "1"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  tags:
    - omar
  script:
    - |
      echo "DEBIAN_SOURCE_DIRECTORIES=$DEBIAN_SOURCE_DIRECTORIES" > .dotenv
      declare -a FAILED_IMPORTS
      for srcdir in $DEBIAN_SOURCE_DIRECTORIES; do
        PACKAGE="$(dpkg-parsechangelog -S Source -l $srcdir/debian/changelog)"
        if ! repo_admin.py \
          --git "$CI_REPOSITORY_URL" \
          --force \
          --branch "$CI_COMMIT_REF_NAME" \
          --path "$srcdir" \
          --release $[[ inputs.ucs_base_version ]]-0-0 \
          --scope $[[ inputs.scope ]] \
          --package "$PACKAGE"; then
          FAILED_IMPORTS+=("$PACKAGE")
        fi
      done
      if [ ${#FAILED_IMPORTS[@]} -ne 0 ]; then
        echo "The following packages could not be imported: " "${FAILED_IMPORTS[@]}"
        exit 1
      fi
  artifacts:
    reports:
      dotenv: .dotenv

deb_repo_build:
  stage: $[[ inputs.build_stage ]]
  needs:
    - job: deb_repo_import
  variables:
    GIT_DEPTH: "1"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  tags:
    - ladda
  script:
    - |
      declare -a FAILED_BUILDS
      for srcdir in $DEBIAN_SOURCE_DIRECTORIES; do
        PACKAGE="$(dpkg-parsechangelog -S Source -l $srcdir/debian/changelog)"
        if ! build-package-ng \
          --no-pbuilder-update \
          --release $[[ inputs.ucs_base_version ]]-0-0 \
          --scope $[[ inputs.scope ]] \
          --package "$PACKAGE"; then
          FAILED_BUILDS+=("$PACKAGE")
        fi
      done
      if [ ${#FAILED_BUILDS[@]} -ne 0 ]; then
        echo "The following packages could not be built: " "${FAILED_BUILDS[@]}"
        exit 1
      fi
    - rm artifacts/* || true
    - install -d -m 755 artifacts || true
    - cp /var/univention/buildsystem2/apt/ucs_$[[ inputs.ucs_base_version ]]-0-$[[ inputs.scope ]]/*/*.deb artifacts/
  artifacts:
    paths:
      - artifacts

upload_from_git:
  stage: $[[ inputs.build_stage ]]
  image: gitregistry.knut.univention.de/univention/dev/tooling/ci-components/app-release:latest
  rules:
    - "$[[ inputs.git_build_rules ]]"
  needs:
    - deb_build_git
    - "$[[ inputs.additional_upload_needs ]]"
  script:
    - |
      if [ "$(ls -A artifacts/)" ]; then
           univention-appcenter-control upload --noninteractive --upload-packages-although-published "$APP_UCS_VERSION/$APP_ID=$APP_VERSION" $(find artifacts/ -name '*.deb')
      	else
          echo "No packages to upload."
      	fi

upload_from_build_system:
  stage: $[[ inputs.build_stage ]]
  image: gitregistry.knut.univention.de/univention/dev/tooling/ci-components/python:latest
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  needs:
    - deb_repo_build
    - "$[[ inputs.additional_upload_needs ]]"
  script:
    - export HOME="$CI_PROJECT_DIR"
    - echo "$APPCENTER_CONTROL_USERNAME" > "$HOME/.univention-appcenter-user"
    - echo "$APPCENTER_CONTROL_PASSWORD" > "$HOME/.univention-appcenter-pwd"
    - |
      if [ "$[[ inputs.yaml_based_upload ]]" == "false" ]; then
        univention-appcenter-control upload --noninteractive --upload-packages-although-published "$APP_UCS_VERSION/$APP_ID=$APP_VERSION" $(find artifacts/ -name '*.deb')
      else
        staging_yamls="$(find doc/errata/staging/ -name "*.yaml" -not -name "0template.yaml")"
        if [ -n "$staging_yamls" ]; then
          copy_app_binaries --yes-i-really-want-it-non-interactive --ucsversion $[[ inputs.ucs_base_version ]] --appversion "$APP_VERSION" --upload $(find doc/errata/staging/ -name "*.yaml" -not -name "0template.yaml")
        fi
      fi
