spec:
  inputs:
    app_id:
      description: "The app id of the app to release."
    changelog_link:
      description: "Link to the changelog document. This is included in the release notes, as well as default announcement messages."
    ucs_base_version:
      description: "The UCS base version the app versions are scoped for."
    image_app_release:
      default: "gitregistry.knut.univention.de/univention/dev/internal/ucsschool-ci-utils/app-release:latest"
      description: "Image for the release jobs."
    app_staging_version:
      default: "999.0.0-staging"
      description: "This version will be used to create an app version from the default branch."
    job_prefix:
      default: ""
      description: "Optional job prefix, for example the app name."
    build_stage:
      default: "build"
      description: "The name of the stage which contains the build jobs."
    release_stage:
      default: "release"
      description: "The name of the stage which contains the release jobs. Needs to be after the build stage."
    cleanup_stage:
      default: "cleanup"
      description: "The name of the stage which contains the cleanup jobs. Needs to be after the release stage."
    additional_update_appcenter_needs:
      type: array
      default: []
      description: "Additional jobs needed for the update_appcenter job (e.g. for templating)."
    appcenter_file_dir:
      default: "appcenter/"
      description: "Directory which stores appcenter meta files. Subdirectories are ignored."
    mail_recipient:
      default: "$GITLAB_USER_EMAIL"
      description: "Email address to send app announcement mail to."
    mail_sender:
      default: "$GITLAB_USER_EMAIL"
      description: "Email address to write app announcement mail as."
    mail_subject:
      default: "App Release: $APP_NAME"
      description: "Subject for the release announcement mail."
    author_alias:
      default: "$GITLAB_USER_NAME"
      description: "Name which will be used as the author in the release messages."
    chat_destination:
      default: "@$GITLAB_USER_LOGIN"
      description: "Channel to send the release message to."
    release_text_file:
      default: "/var/lib/default_release_text.txt"
      description: "Content for the release mail and chat message."
    release_tag_prefix:
      default: "release-"
      description: "Required prefix for a tag to trigger the release pipeline."
    release_tag_constraint:
      default: '[0-9]+\.[0-9]+\.[0-9]+'
      description: "The required format of tags following the release tag prefix to trigger the release pipeline."

---
"$[[ inputs.job_prefix ]]create_app_version":
  stage: "$[[ inputs.build_stage ]]"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^$[[ inputs.release_tag_prefix ]]$[[ inputs.release_tag_constraint ]]$/'
      variables:
        ENVIRONMENT_NAME: "release-app/${APP_ID}_$CI_COMMIT_TAG"

    - if: $CI_MERGE_REQUEST_ID
      variables:
        ENVIRONMENT_NAME: "branch-app/${APP_ID}_$CI_COMMIT_REF_SLUG"
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        ENVIRONMENT_NAME: "staging-app/${APP_ID}_$[[ inputs.app_staging_version ]]"
  image: "$[[ inputs.image_app_release ]]"
  artifacts:
    reports:
      dotenv: deploy.env
  variables:
    APP_UCS_VERSION: "$[[ inputs.ucs_base_version ]]"
    APP_ID: "$[[ inputs.app_id ]]"
    RELEASE_TAG_PREFIX: "$[[ inputs.release_tag_prefix ]]"
    APP_STAGING_VERSION: "$[[ inputs.app_staging_version ]]"
  script:
    - create_app_version
  environment:
    name: "$ENVIRONMENT_NAME"
    url: "https://provider-portal.software-univention.de/univention/management/?header=try-hide&overview=false&menu=false#module=appcenter-selfservice::0:$APP_ID:$APP_COMPONENT_ID:$APP_UCS_VERSION"
    on_stop: "$[[ inputs.job_prefix ]]delete_app_version"

"$[[ inputs.job_prefix ]]delete_app_version":
  stage: "$[[ inputs.cleanup_stage ]]"
  needs:
    - "$[[ inputs.job_prefix ]]create_app_version"
  variables:
    ENVIRONMENT_NAME: "$ENVIRONMENT_NAME"
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^$[[ inputs.release_tag_prefix ]]$[[ inputs.release_tag_constraint ]]$/'
      variables:
        ENVIRONMENT_NAME: "release-app/${APP_ID}_$CI_COMMIT_TAG"
      when: never
    - if: $CI_MERGE_REQUEST_ID
      variables:
        ENVIRONMENT_NAME: "staging-app/${APP_ID}_$CI_COMMIT_REF_SLUG"
      when: manual
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        ENVIRONMENT_NAME: "branch-app/${APP_ID}_$[[ inputs.app_staging_version ]]"
      when: never
  image: "$[[ inputs.image_app_release ]]"
  script:
    - delete_app_version
  environment:
    name: "$ENVIRONMENT_NAME"
    action: stop

"$[[ inputs.job_prefix ]]update_appcenter":
  stage: "$[[ inputs.build_stage ]]"
  needs:
    - "$[[ inputs.job_prefix ]]create_app_version"
    - "$[[ inputs.additional_update_appcenter_needs ]]"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^$[[ inputs.release_tag_prefix ]]$[[ inputs.release_tag_constraint ]]$/'
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  image: "$[[ inputs.image_app_release ]]"
  variables:
    APPCENTER_FILE_DIR: "$[[ inputs.appcenter_file_dir ]]"
  script:
    - echo "Rendering all appcenter file templates."
    - render_appcenter_files
    - echo "Uploading appcenter files for $APP_UCS_VERSION/$APP_ID=$APP_VERSION."
    - UPLOAD_FILES=$(find "$APPCENTER_FILE_DIR" -maxdepth 1 -type f -not -name '*.jinja' | xargs)
    - 'echo "Uploading files: $UPLOAD_FILES"'
    - univention-appcenter-control upload --noninteractive "$APP_UCS_VERSION/$APP_ID=$APP_VERSION" $UPLOAD_FILES

"$[[ inputs.job_prefix ]]do_release":
  stage: "$[[ inputs.release_stage ]]"
  image: "$[[ inputs.image_app_release ]]"
  tags:
    - omar
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_TAG =~ /^$[[ inputs.release_tag_prefix ]]$[[ inputs.release_tag_constraint ]]$/'
      when: manual
      allow_failure: false
  manual_confirmation: "LAST WARNING: App will be made public NOW!"
  script:
    - echo "$APP_NAME will be released in $APP_VERSION"
    - cd /mnt/omar/vmwares/mirror/appcenter
    - sudo /mnt/omar/vmwares/mirror/appcenter/copy_from_appcenter.test.sh "$APP_UCS_VERSION" "$APP_COMPONENT_ID"
    - sudo /usr/bin/update_mirror.sh -v appcenter

"$[[ inputs.job_prefix ]]create_gitlab_release":
  stage: "$[[ inputs.release_stage ]]"
  needs:
    - "$[[ inputs.job_prefix ]]check_release"
    - "$[[ inputs.job_prefix ]]create_app_version"
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^$[[ inputs.release_tag_prefix ]]$[[ inputs.release_tag_constraint ]]$/'
  script:
    - echo "Running the release job."
  release:
    tag_name: $CI_COMMIT_TAG
    name: "$APP_NAME: $APP_VERSION"
    description: "$CI_COMMIT_TAG_MESSAGE"
    assets:
      links:
        - name: Changelog
          url: "$[[ inputs.changelog_link ]]"

"$[[ inputs.job_prefix ]]check_release":
  stage: "$[[ inputs.release_stage ]]"
  needs:
    - "$[[ inputs.job_prefix ]]do_release"
    - "$[[ inputs.job_prefix ]]create_app_version"
  image: "$[[ inputs.image_app_release ]]"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^$[[ inputs.release_tag_prefix ]]$[[ inputs.release_tag_constraint ]]$/'
      allow_failure: false
  manual_confirmation: "Did you publish the app on omar (see: https://git.knut.univention.de/univention/components/ucsschool-kelvin-rest-api#publish-packages-from-test-appcenter-to-production-appcenter)?"
  script:
    - echo "Checking if $APP_NAME was released in $APP_VERSION"
    - curl --fail "https://appcenter.software-univention.de/meta-inf/$APP_UCS_VERSION/$APP_ID/$APP_COMPONENT_ID.ini"

"$[[ inputs.job_prefix ]]send_mail":
  rules:
    - if: '$CI_COMMIT_TAG =~ /^$[[ inputs.release_tag_prefix ]]$[[ inputs.release_tag_constraint ]]$/'
  stage: "$[[ inputs.release_stage ]]"
  needs:
    - "$[[ inputs.job_prefix ]]check_release"
    - "$[[ inputs.job_prefix ]]create_app_version"
  variables:
    GIT_DEPTH: 1
    RECIPIENT: "$[[ inputs.mail_recipient ]]"
    SENDER: "$[[ inputs.mail_sender ]]"
    SUBJECT: "$[[ inputs.mail_subject ]]"
    MAIL_FILE: "$[[ inputs.release_text_file ]]"
    CHANGELOG_LINK: "$[[ inputs.changelog_link ]]"
    AUTHOR_ALIAS: "$[[ inputs.author_alias ]]"
  tags:
    - omar
  script:
    - cat "$MAIL_FILE" | envsubst | mail -s "$SUBJECT" -r "$SENDER" "$RECIPIENT"

"$[[ inputs.job_prefix ]]send_chat_message":
  stage: "$[[ inputs.release_stage ]]"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^$[[ inputs.release_tag_prefix ]]$[[ inputs.release_tag_constraint ]]$/'
  needs:
    - "$[[ inputs.job_prefix ]]check_release"
    - "$[[ inputs.job_prefix ]]create_app_version"
  image: $[[ inputs.image_app_release ]]
  variables:
    BASE_URL: "https://chat.univention.de"
    DESTINATION: "$[[ inputs.chat_destination ]]"
    AUTHOR_ALIAS: "$[[ inputs.author_alias ]]"
    ROCKETCHAT_USERNAME: "flubberbot"
    MESSAGE_FILE: "$[[ inputs.release_text_file ]]"
    CHANGELOG_LINK: "$[[ inputs.changelog_link ]]"
  script:
    - send_chat
