---
x-deb-common: &deb-common
  build:
    context: ../../images/deb-builder
    dockerfile: deb-builder.Containerfile
    args:
      UCSVERSION: "525"
  image: deb-builder:local
  entrypoint: ""
  working_dir: /build

x-deb-env: &deb-env
  APTLY: http://omar.knut.univention.de:11620/api
  APT: http://omar.knut.univention.de/build2/git
  BASE_APT: http://omar.knut.univention.de/build2/
  UCS_VERSION: "5.2-5"
  UCS_RELEASE: "5.2"
  CI_PROJECT_NAME: keycloak
  CI_PROJECT_DIR: /build
  CI_COMMIT_REF_SLUG: test-local
  CI_COMMIT_REF_NAME: test-local
  CI_JOB_ID: local-${USER:-test}
  APTLY_REPO: keycloak-test-local

services:
  aptly-prepare:
    <<: *deb-common
    # volumes:
    #   - ./scripts:/build/scripts:ro
    environment:
      <<: *deb-env
    command: >
      sh -c '
        aptly-create || true
        aptly-publish || true
      '

  aptly-build:
    <<: *deb-common
    volumes:
      # - ./scripts:/build/scripts:ro
      - ./univention-keycloak:/build/univention-keycloak:rw
      - deb-output:/build/output
    environment:
      <<: *deb-env
    command: >
      sh -c '
        aptly-build univention-keycloak
        cp -v *.deb *.changes output/ 2>/dev/null || true
      '

  aptly-remove:
    <<: *deb-common
    # volumes:
    #   - ./scripts:/build/scripts:ro
    environment:
      <<: *deb-env
    command: >
      sh -c '
        aptly-remove || true
      '

  deb-shell:
    <<: *deb-common
    volumes:
    # - ./scripts:/build/scripts:ro
      - ./univention-keycloak:/build/univention-keycloak:rw
    environment:
      <<: *deb-env
    command: bash
    stdin_open: true
    tty: true

volumes:
  deb-output: {}
...
