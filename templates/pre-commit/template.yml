spec:
  inputs:
    job_prefix:
      default: ""
      description: "Optional job prefix, for example the app name."
    pipeline_stage:
      default: "build"
      description: "The name of the stage which contains the pre-commit jobs."
    skip_hooks:
      default: ""
      description: "Space or comma separated list of pre-commit hook ids to skip in the automatic run."
    manual_stage_hooks:
      default: ""
      description: "Space or comma separated list of manual-stage hook ids to run in run_pre_commit."
    commit_msg_hooks:
      default: ""
      description: "Space separated list of hooks to run on each commit message."

---

include:
  - project: univention/infrastructure/docker-services
    file: prek.yml

"$[[ inputs.job_prefix ]]run_pre_commit":
  stage: "$[[ inputs.pipeline_stage ]]"
  image: "gitregistry.knut.univention.de/univention/dev/tooling/ci-components/prek:latest"
  needs: []
  variables:
    SKIP: "$[[ inputs.skip_hooks ]]"
  extends: .prek
  script:
    - |
      MANUAL_HOOKS="$(echo "$[[ inputs.manual_stage_hooks ]]" | tr ',' ' ')"
      EXIT_CODE=0

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git fetch --no-tags --depth=1 origin "${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
        since=$(git show --no-patch --format=tformat:%cI "${CI_MERGE_REQUEST_DIFF_BASE_SHA}")
        git fetch --no-tags --shallow-since="${since}" --filter=tree:0 origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        prek run --from-ref "${CI_MERGE_REQUEST_DIFF_BASE_SHA}" --to-ref "${CI_COMMIT_SHA}" || EXIT_CODE=1
        for HOOK_ID in $MANUAL_HOOKS; do
          prek run --hook-stage manual --from-ref "${CI_MERGE_REQUEST_DIFF_BASE_SHA}" --to-ref "${CI_COMMIT_SHA}" "$HOOK_ID" || EXIT_CODE=1
        done
      else
        prek run -a || EXIT_CODE=1
        for HOOK_ID in $MANUAL_HOOKS; do
          prek run --hook-stage manual -a "$HOOK_ID" || EXIT_CODE=1
        done
      fi

      exit $EXIT_CODE

"$[[ inputs.job_prefix ]]lint_commit_messages":
  stage: "$[[ inputs.pipeline_stage ]]"
  image: "gitregistry.knut.univention.de/univention/dev/tooling/ci-components/prek:latest"
  needs: []
  variables:
    PREK_HOME: "${CI_PROJECT_DIR}/.cache/prek"
    GIT_DEPTH: 1
  rules:
    - if: $CI_MERGE_REQUEST_ID
  script:
    - |
      # CI_MERGE_REQUEST_DIFF_BASE_SHA is not included in the shallow clone; fetch it so
      # we can read its timestamp for --shallow-since and use it as the rev-list base.
      git fetch --no-tags --depth=1 origin "${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
      since=$(git show --no-patch --format=tformat:%cI "${CI_MERGE_REQUEST_DIFF_BASE_SHA}")
      git fetch --no-tags --shallow-since="${since}" --filter=tree:0 origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
      HOOK_IDS="$[[ inputs.commit_msg_hooks ]]"
      COMMITS=$(git rev-list "${CI_MERGE_REQUEST_DIFF_BASE_SHA}..HEAD")
      echo "Checking $(echo "$COMMITS" | wc -w) commits."
      EXIT_CODE=0
      for COMMIT in $COMMITS; do
        echo "Checking commit message for: $COMMIT"
        git show -s --format=%B "$COMMIT" | head -n -1 > tmp.txt
        for HOOK_ID in $HOOK_IDS; do
          prek run --hook-stage commit-msg --commit-msg-filename tmp.txt "$HOOK_ID" || EXIT_CODE=1
        done
      done
      exit $EXIT_CODE

