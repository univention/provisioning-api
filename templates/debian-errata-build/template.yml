#
# GitLab CI/CD Component: debian-errata-build
#
# Publishes Debian packages to the errata repository via repo_admin.py
# and build-package-ng. Triggered on tags or manually.
#
# Jobs produced:
#   errata-import  — imports package metadata to the build system
#   errata-build   — builds and publishes the package
#
# Note: Runs only on protected branches.
#       Set UCS_VERSION in your .gitlab-ci.yml variables (e.g. "5.2-5").
#       The release passed to repo_admin.py is derived as ${UCS_VERSION%%-*} (e.g. "5.2")
#       and the scope as errata${UCS_VERSION} (e.g. "errata5.2-5").

spec:
  inputs:
    debian-package:
      description: "Name of the Debian package"
      type: string
    pkg-dir:
      description: "Path to the package directory"
      type: string
      default: "."
    stage:
      description: "Stage for the jobs"
      type: string
      default: "publish"
---

errata-import:
  stage: $[[ inputs.stage ]]
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        - $[[ inputs.pkg-dir ]]/debian/changelog
  tags:
    - omar
  script:
    - |
      repo_admin.py \
        --git "$CI_REPOSITORY_URL" \
        --branch "$CI_COMMIT_REF_NAME" \
        --path "$[[ inputs.pkg-dir ]]" \
        --release "${UCS_VERSION%%-*}" \
        --scope "errata${UCS_VERSION}" \
        --package "$[[ inputs.debian-package ]]" \
        --verbose

errata-build:
  stage: $[[ inputs.stage ]]
  needs:
    - job: errata-import
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        - $[[ inputs.pkg-dir ]]/debian/changelog
  tags:
    - ladda
  script:
    - |
      build-package-ng \
        --no-pbuilder-update \
        --release "${UCS_VERSION%%-*}" \
        --scope "errata${UCS_VERSION}" \
        --package "$[[ inputs.debian-package ]]"
