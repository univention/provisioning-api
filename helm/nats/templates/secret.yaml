{{- /*
An existing Secret, a password or a seed is required, in this order of precedence.
The seed only counts while generation is on.
*/}}
{{- $_ := required
  "A Nats admin password is required, see parameter config.createUsers.adminUser.auth."
  (coalesce
    (.Values.config.createUsers.adminUser.auth.existingSecret).name
    (.Values.config.createUsers.adminUser.auth).password
    (and (include "nubus-common.secrets.generatePasswords" .) ((.Values.global).secrets).masterPassword)
  )
}}
{{- if not (.Values.config.createUsers.adminUser.auth.existingSecret).name }}
{{- $name := include "nubus-common.secrets.name" (dict "defaultNameSuffix" "admin" "context" .) | quote -}}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ $name }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" $ ) | nindent 4 }}
  annotations:
    {{- if (.Values.global.secrets).keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- if .Values.additionalAnnotations }}
      {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- if (.Values.config.createUsers.adminUser.auth).password }}
  password: {{ .Values.config.createUsers.adminUser.auth.password | quote }}
  {{- else }}
  password: {{ printf "nbs_%s" (print (derivePassword 1 "long" .Values.global.secrets.masterPassword "nubus" "provisioning-nats") | sha1sum) | quote }}
  {{- end }}
{{- end }}
