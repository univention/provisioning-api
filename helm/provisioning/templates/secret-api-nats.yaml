{{- /*
An existing Secret, a password or a seed is required, in this order of precedence.
The seed only counts while generation is on.
*/}}
{{- $_ := required
  "A Nats password is required, see parameter api.nats.auth."
  (coalesce
    (.Values.api.nats.auth.existingSecret).name
    .Values.api.nats.auth.password
    (and (include "nubus-common.secrets.generatePasswords" .) ((.Values.global).secrets).masterPassword)
  )
}}
{{- if not (.Values.api.nats.auth.existingSecret).name }}
{{- $secretName := (include "nubus-common.secrets.name" (dict "defaultNameSuffix" "nats-api" "context" .)) }}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- $extraAnnotations := dict }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list $extraAnnotations .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
stringData:
  {{- if (.Values.api.nats.auth).password }}
  password: {{ .Values.api.nats.auth.password | quote }}
  {{- else }}
  password: {{ printf "nbs_%s" (print (derivePassword 1 "long" .Values.global.secrets.masterPassword "nubus" "provisioning-api") | sha1sum) | quote }}
  {{- end }}
{{- end }}
