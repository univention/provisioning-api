---
global:
  secrets:
    masterPassword: ""
  systemExtensions:
    - name: "portal"
      image:
        repository: "nubus/images/portal-extension"
        tag: "0.44.3@sha256:734efc0adda680526dde09387db964612f9e0ab020382580984488cc993c68f0"


resources:
  dispatcher:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "32Mi"
  prefill:
    config:
      UDM_HOST: "udm-host"
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "32Mi"
  api:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "32Mi"
  udmTransformer:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "32Mi"

udmTransformer:
  nats:
    auth:
      password: "stub-value"
  udm:
    auth:
      password: "linter-udm-transformer-udm-password"

prefill:
  config:
    UDM_HOST: "udm-host"
  udm:
    auth:
      password: "linter-prefill-udm-password"
  nats:
    auth:
      password: "stub-value"

dispatcher:
  nats:
    auth:
      password: "stub-value"

# The passwords below are needed by the tests that render the chart with global.secrets.generatePasswords: false.
# That mode ignores the masterPassword, so every password must be set.
api:
  auth:
    admin:
      password: "linter-api-admin-password"
    prefill:
      password: "linter-api-prefill-password"
    eventsUdm:
      password: "linter-api-events-password"
  nats:
    auth:
      password: "stub-value"

registerConsumers:
  provisioningApiBaseUrl: "provisioning-base-url"
  createUsers:
    portal-consumer:
      existingSecret:
        name: "linter-portal-consumer-provisioning-api"
        keyMapping:
          registration: null
  udm:
    auth:
      password: "linter-register-consumers-udm-password"

nats:
  config:
    createUsers:
      adminUser:
        auth:
          # Admin password of the bundled nats, needed without a masterPassword.
          password: "linter-nats-admin-password"
  # Required when nats.bundled: false is set
  connection:
    host: "linter-nats-host"
    port: "linter-nats-port"
...
