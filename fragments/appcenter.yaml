variables:
  APPCENTER_CONTROL_IMAGE: "gitregistry.knut.univention.de/univention/dev/internal/ucsschool-ci-utils/univention-appcenter-control"
  APP_BASE_VERSION: "0.0.0-staging"

.create_app_version:
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        APP_VERSION: "$CI_COMMIT_TAG"
        ENVIRONMENT_NAME: "release-app/$CI_COMMIT_TAG"
    - if: $CI_MERGE_REQUEST_ID
      variables:
        APP_VERSION: "0.0.0-$CI_COMMIT_REF_SLUG"
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        APP_VERSION: "$APP_BASE_VERSION"
  image: "$APPCENTER_CONTROL_IMAGE"
  environment:
    name: "$ENVIRONMENT_NAME"
    url: "https://provider-portal.software-univention.de/univention/management/?header=try-hide&overview=false&menu=false#module=appcenter-selfservice::0:$APP_ID:$APP_COMPONENT_ID:$APP_UCS_VERSION"
    on_stop: delete_app_version
  artifacts:
    reports:
      dotenv: deploy.env
  variables:
    ENVIRONMENT_NAME: "branch-app/$CI_COMMIT_REF_SLUG"
  script:
    - |
      if [[ -z "$APP_ID" ]]; then
        echo "No APP_ID was set for this job. Aborting."
        exit 1
      fi
    - |
      if [[ -z "$APP_UCS_VERSION" ]]; then
        echo "No APP_UCS_VERSION was set for this job. Aborting."
        exit 1
      fi
    - |
      if univention-appcenter-control status --noninteractive "$APP_UCS_VERSION/$APP_ID" | grep -F "$APP_VERSION"; then
        echo "App version $APP_UCS_VERSION/$APP_ID=$APP_VERSION already exists. Skip creating app."
      else
        echo "Creating $APP_UCS_VERSION/$APP_ID=$APP_VERSION in test appcenter."
        univention-appcenter-control new-version --noninteractive "$APP_UCS_VERSION/$APP_ID=$APP_BASE_VERSION" "$APP_UCS_VERSION/$APP_ID=$APP_VERSION"
      fi
    - univention-appcenter-control get --noninteractive --json "$APP_UCS_VERSION/$APP_ID" > appinfo.json
    - APP_COMPONENT_ID=$(cat appinfo.json | jq --arg version "$APP_VERSION" -r '.versions[] | select(.version == $version) | .component_id')
    - echo "APP_ID=$APP_ID" >> deploy.env; echo "APP_COMPONENT_ID=$APP_COMPONENT_ID" >> deploy.env; echo "APP_UCS_VERSION=$APP_UCS_VERSION" >> deploy.env; echo "APP_VERSION=$APP_VERSION" >> deploy.env
    - cat appinfo.json | jq --arg version "$APP_VERSION" '.versions[] | select(.version == $version)'

.delete_app_version:
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
      variables:
        ENVIRONMENT_NAME: "release-app/$CI_COMMIT_TAG"
    - if: $CI_MERGE_REQUEST_ID
      when: manual
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: never
  image: "$APPCENTER_CONTROL_IMAGE"
  variables:
    ENVIRONMENT_NAME: "branch-app/$CI_COMMIT_REF_SLUG"
  script:
    - |
      if [[ -z "$APP_ID" ]]; then
        echo "No APP_ID was set for this job. Aborting."
        exit 1
    - |
      if [[ -z "$APP_UCS_VERSION" ]]; then
        echo "No APP_UCS_VERSION was set for this job. Aborting."
        exit 1
      fi
      fi
    - |
      if univention-appcenter-control status "$APP_UCS_VERSION/$APP_ID" | grep -F "$APP_VERSION"; then
        echo "Removing $APP_UCS_VERSION/$APP_ID=$APP_VERSION from test appcenter."
        univention-appcenter-control remove-version --noninteractive "$APP_UCS_VERSION/$APP_ID=$APP_VERSION"
      else
        echo "App version $APP_UCS_VERSION/$APP_ID=$APP_VERSION could not be found in test appcenter. Skip removal."
      fi
  environment:
    name: "$ENVIRONMENT_NAME"
    action: stop

.update_appcenter:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  image: "$APPCENTER_CONTROL_IMAGE"
  variables:
    APPCENTER_FILE_DIR: "appcenter/"
  script:
    - echo "Uploading appcenter files for $APP_UCS_VERSION/$APP_ID=$APP_VERSION."
    - crudini --set "$APPCENTER_FILE_DIR/ini" Application Version "$APP_VERSION"
    - if [ -n "$IMAGE_TAG" ]; then crudini --set --existing "$APPCENTER_FILE_DIR/ini" Application DockerImage "$IMAGE_TAG" || echo "Does not seem to be a docker image based app. Not setting DockerImage."; fi
    - cd "$APPCENTER_FILE_DIR"
    - univention-appcenter-control upload --noninteractive "$APP_UCS_VERSION/$APP_ID=$APP_VERSION" *

.do_release:
  image: gitregistry.knut.univention.de/univention/dev/internal/ucsschool-ci-utils/univention-appcenter-control
  tags:
    - omar
  variables:
    GIT_STRATEGY: none
  rules:
    - if: "$CI_COMMIT_TAG"
      when: manual
      allow_failure: false
  manual_confirmation: "LAST WARNING: App will be made pulic NOW?"
  script:
    - echo "$APP_NAME will be released in $APP_VERSION"
    - cd /mnt/omar/vmwares/mirror/appcenter
    - sudo /mnt/omar/vmwares/mirror/appcenter/copy_from_appcenter.test.sh "$APP_UCS_VERSION" "$APP_COMPONENT_ID"
    - sudo /usr/bin/update_mirror.sh -v appcenter

.create_gitlab_release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - echo "Running the release job."
  release:
    tag_name: $CI_COMMIT_TAG
    name: "$CI_COMMIT_TAG"
    description: "$CI_COMMIT_TAG_MESSAGE"

.check_release:
  image: gitregistry.knut.univention.de/univention/dev/internal/ucsschool-ci-utils/univention-appcenter-control
  rules:
    - if: "$CI_COMMIT_TAG"
      allow_failure: false
  manual_confirmation: "Did you publish the app on omar (see: https://git.knut.univention.de/univention/components/ucsschool-kelvin-rest-api#publish-packages-from-test-appcenter-to-production-appcenter)?"
  script:
    - echo "Checking if $APP_NAME was released in $APP_VERSION"
    - curl --fail "https://appcenter.software-univention.de/meta-inf/$APP_UCS_VERSION/$APP_ID/$APP_COMPONENT_ID.ini"
