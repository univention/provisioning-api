variables:
  PRE_COMMIT_IMAGE: "gitregistry.knut.univention.de/univention/dev/internal/ucsschool-ci-utils/pre-commit:latest"

.lint_commit_messages:
  image: $PRE_COMMIT_IMAGE
  rules:
    - if: $CI_MERGE_REQUEST_ID
  variables:
    HOOK_IDS: "conventional-pre-commit"
  script:
    - |
      NUM_COMMITS=$(curl $CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/commits | jq length)
      echo "Checking $NUM_COMMITS commits."
      COMMITS=$(git rev-list HEAD..."HEAD~$NUM_COMMITS")
      EXIT_CODE=0
      for COMMIT in $COMMITS; do
        echo "Checking COMMIT message for: $COMMIT"
        git show -s --format=%B "$COMMIT" | head -n -1 > tmp.txt
        for HOOK_ID in $HOOK_IDS; do
          pre-commit run --hook-stage commit-msg --commit-msg-filename tmp.txt "$HOOK_ID" || EXIT_CODE=1
        done
      done
      exit $EXIT_CODE

.send_mail:
  variables:
    GIT_STRATEGY: none
    RECIPIENT: "$GITLAB_USER_EMAIL"
    SENDER: "$GITLAB_USER_EMAIL"
    SUBJECT: "Automatic mail from gitlab pipeline"
    MAIL_FILE: "mail.txt"
  tags:
    - omar
  script:
    - cat "$MAIL_FILE" | mail -s "$SUBJECT" -r "$SENDER" "$RECIPIENT"

.send_chat_message:
  image: gitregistry.knut.univention.de/univention/dev/internal/ucsschool-ci-utils/pre-commit:latest # Contains curl and jq
  variables:
    BASE_URL: "https://chat.univention.de"
    DESTINATION: "@$GITLAB_USER_LOGIN"
    ALIAS: "$GITLAB_USER_NAME"
    ROCKETCHAT_USERNAME: "flubberbot"
    MESSAGE: "Please tell $GITLAB_USER_NAME that their pipeline is not configured correctly."
  script:
    - echo "Sending message as $ALIAS to $DESTINATION"
    - 'AUTH_RESPONSE=$(curl -H "Content-type:application/json" "$BASE_URL/api/v1/login" -d "{ \"username\": \"$ROCKETCHAT_USERNAME\", \"password\": \"$ROCKETCHAT_PASSWORD\" }")'
    - AUTH_TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.data.authToken')
    - USER_ID=$(echo "$AUTH_RESPONSE" | jq -r '.data.userId')
    - |
      curl \
      -H "X-Auth-Token: $AUTH_TOKEN" \
      -H "X-User-Id: $USER_ID" \
      -H "Content-type:application/json" \
      "$BASE_URL/api/v1/chat.postMessage" \
      -d "{ \"channel\": \"$DESTINATION\", \"text\": \"$MESSAGE\", \"alias\": \"$ALIAS\" }"
