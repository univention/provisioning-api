include:
  - project: univention/dist/docker-services
    file: kaniko.yml

stages:
  - build

build_ec2_tools:
  stage: build
  extends: .kaniko
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "images/ec2-tools.Containerfile"
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/ec2-tools"
    DOCKERFILE_PATH: "images/ec2-tools.Containerfile"

build_univention_appcenter_control:
  stage: build
  extends: .kaniko
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "images/univention-appcenter-control.Containerfile"
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/univention-appcenter-control"
    DOCKERFILE_PATH: "images/univention-appcenter-control.Containerfile"
