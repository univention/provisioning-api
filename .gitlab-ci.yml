include:
  - project: univention/dist/docker-services
    file: kaniko.yml
  - project: univention/dist/docker-services
    file: pre-commit.yml
  - local: fragments/misc.yaml

stages:
  - build
  - lint

run_pre_commit:
  stage: lint
  needs: []
  extends: .pre-commit

lint_commit_messages:
  stage: lint
  needs: []
  extends: .lint_commit_messages

build_ec2_tools:
  stage: build
  extends: .kaniko
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "images/ec2-tools.Containerfile"
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/ec2-tools"
    DOCKERFILE_PATH: "images/ec2-tools.Containerfile"

build_pre_commit:
  stage: build
  extends: .kaniko
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "images/pre-commit.Containerfile"
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/pre-commit"
    DOCKERFILE_PATH: "images/pre-commit.Containerfile"

build_univention_appcenter_control:
  stage: build
  extends: .kaniko
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "images/univention-appcenter-control.Containerfile"
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/univention-appcenter-control"
    DOCKERFILE_PATH: "images/univention-appcenter-control.Containerfile"
