build_deb_builder52:
  extends: .build_deb_builder
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/deb-builder-5.2"
    KANIKO_ARGS: "--build-arg UCSVERSION=$ucs"

build_deb_builder50:
  extends: .build_deb_builder
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/deb-builder-5.0"
    KANIKO_ARGS: "--build-arg UCSVERSION=5010"

release_cicd_components:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - echo "Releasing for $CI_COMMIT_TAG."
  release:
    tag_name: $CI_COMMIT_TAG
    name: "CI/CD Components: $CI_COMMIT_TAG"
    description: "$CI_COMMIT_TAG_MESSAGE"
