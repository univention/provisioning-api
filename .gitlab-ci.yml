workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_OPEN_MERGE_REQUESTS
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"
    - if: $CI_COMMIT_TAG

include:
  - project: univention/dev/ucs
    file: .gitlab-ci/base.yml
  - project: univention/infrastructure/docker-services
    file: kaniko.yml
  - project: univention/infrastructure/docker-services
    file: pre-commit.yml
  - local: fragments/misc.yaml

stages:
  - build
  - release
  - cleanup

run_pre_commit:
  stage: build
  needs: []
  extends: .pre-commit

lint_commit_messages:
  stage: build
  needs: []
  extends: .lint_commit_messages

build_ec2_tools:
  stage: build
  extends: .kaniko
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "images/ec2-tools.Containerfile"
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/ec2-tools"
    DOCKERFILE_PATH: "images/ec2-tools.Containerfile"

build_pre_commit:
  stage: build
  extends: .kaniko
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "images/pre-commit.Containerfile"
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/pre-commit"
    DOCKERFILE_PATH: "images/pre-commit.Containerfile"

